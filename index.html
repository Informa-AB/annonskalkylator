<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Informa annonskalkylator</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='60' fill='%231E1B19'/%3E%3Ctext x='56' y='64' dominant-baseline='central' text-anchor='middle' font-family='Georgia,serif' font-size='66' fill='%23F1ECE3'%3EI%3C/text%3E%3Ccircle cx='82' cy='85' r='7' fill='%23FA7896'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: #F1ECE3;
      color: #1A1916;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Slider */
    .informa-slider {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px;
      border-radius: 2px; outline: none;
      cursor: pointer; display: block;
    }
    .informa-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: #E85B7D; cursor: pointer;
      border: 2px solid #F1ECE3;
      transition: transform 0.1s;
    }
    .informa-slider::-webkit-slider-thumb:active { transform: scale(1.15); }
    .informa-slider::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: #E85B7D; cursor: pointer;
      border: 2px solid #F1ECE3;
    }
    .informa-slider::-moz-range-track  { height: 4px; border-radius: 2px; background: #DFD8CB; }
    .informa-slider::-moz-range-progress { height: 4px; border-radius: 2px 0 0 2px; background: #E85B7D; }

    /* Number input – remove spinners */
    .no-spin::-webkit-inner-spin-button,
    .no-spin::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .no-spin { -moz-appearance: textfield; }

    /* Focus */
    input:focus, select:focus {
      border-color: #E85B7D !important;
      outline: none;
    }

    /* Animations */
    @keyframes fadeUp   { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pinShake {
      0%,100% { transform:translateX(0); }
      15%  { transform:translateX(-9px); }  30%  { transform:translateX(8px); }
      45%  { transform:translateX(-6px); }  60%  { transform:translateX(5px); }
      75%  { transform:translateX(-3px); }  90%  { transform:translateX(2px); }
    }
    .tab-in { animation: fadeUp 0.3s ease both; }

    /* Toast */
    @keyframes toastIn  { from { opacity:0; transform:translateY(16px) scale(0.96); } to { opacity:1; transform:none; } }
    @keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateY(8px); } }
    .toast     { animation: toastIn  0.28s ease both; }
    .toast-out { animation: toastOut 0.28s ease both; }

    /* Print styles */
    @media print {
      .no-print { display: none !important; }
      header    { display: none !important; }
      body      { background: white; }
      .tab-in   { animation: none !important; }
      .print-header {
        display: flex !important;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.75rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #1A1916;
      }
    }
    .print-header { display: none; }

    /* Mobile */
    @media (max-width: 600px) {
      .slider-row { flex-direction: column; align-items: stretch !important; gap: 0.5rem !important; }
      .slider-number-wrap { justify-content: flex-end; }
      .cta-row { flex-direction: column !important; }
      .cta-row a, .cta-row button { width: 100% !important; text-align: center; }
      .split { grid-template-columns: 1fr !important; }
      .quad  { grid-template-columns: 1fr 1fr !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.4/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ── Informa brand 2026 ────────────────────────────────────────────────────
    const PINK  = "#E85B7D";              // rosa på ljus yta
    const ROSA  = "#FA7896";              // accent på noir
    const INK   = "#1A1916";
    const INK2  = "#5C5852";
    const INK3  = "#8A8579";
    const CREAM = "#F1ECE3";
    const PAPER = "#FBF7EF";
    const NOIR  = "#1E1B19";
    const HAIR  = "rgba(26,25,22,0.14)";  // hårfin linje
    const HAIR2 = "rgba(26,25,22,0.08)";
    const SERIF = "'Newsreader',serif";

    // Ordmärket "Informa." med rosa slutpunkt
    const Wordmark = ({ size = "1.6rem", color = INK, dot = PINK }) => (
      <span style={{ fontFamily:SERIF, fontWeight:400, fontSize:size, color, letterSpacing:"0.004em", lineHeight:1 }}>
        Informa<span style={{ color: dot }}>.</span>
      </span>
    );

    // ──────────────────────────────────────────────────────────────────────────
    const sek = (n) =>
      new Intl.NumberFormat("sv-SE").format(Math.round(n))
        .replace(/ | | /g, " ");

    const dec1 = (n) =>
      new Intl.NumberFormat("sv-SE", { minimumFractionDigits:1, maximumFractionDigits:1 }).format(n)
        .replace(/ | | /g, " ");

    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    // Titlar Informa säljer annonser för (publikt bekräftade uppdrag)
    const TITLES = ["Läkartidningen","Dagens Samhälle","Ny Teknik","Energi & Miljö",
                    "Aktuell Hållbarhet","Besöksliv","Annan titel"];

    // ────────── localStorage hook ────────────────────────────────────────────
    function useLS(key, init) {
      const [val, setVal] = useState(() => {
        try {
          const raw = localStorage.getItem(key);
          return raw !== null ? JSON.parse(raw) : init;
        } catch (e) { return init; }
      });
      const set = useCallback((v) => {
        setVal(v);
        try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {}
      }, [key]);
      return [val, set];
    }

    // ────────── Count-up animation ──────────────────────────────────────────────
    function useCountUp(target, ms = 520) {
      const [val, setVal]  = useState(target);
      const fromRef        = useRef(target);
      const rafRef         = useRef(null);
      useEffect(() => {
        const from = fromRef.current, to = target, t0 = performance.now();
        cancelAnimationFrame(rafRef.current);
        const tick = (now) => {
          const p = Math.min((now - t0) / ms, 1);
          const e = 1 - Math.pow(1 - p, 3);
          setVal(from + (to - from) * e);
          if (p < 1) rafRef.current = requestAnimationFrame(tick);
          else fromRef.current = to;
        };
        rafRef.current = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(rafRef.current);
      }, [target]);
      return val;
    }

    // ────────── Toast notification ─────────────────────────────────────────────
    function Toast({ msg, onDone }) {
      const [out, setOut] = useState(false);
      useEffect(() => {
        const t1 = setTimeout(() => setOut(true), 2200);
        const t2 = setTimeout(() => { if (onDone) onDone(); }, 2500);
        return () => { clearTimeout(t1); clearTimeout(t2); };
      }, []);
      return (
        <div className={out ? "toast-out" : "toast"} style={{
          position:"fixed", bottom:32, left:"50%", transform:"translateX(-50%)",
          background:NOIR, color:CREAM, padding:"0.7rem 1.5rem",
          borderRadius:"2px", fontSize:"0.9rem", fontWeight:500,
          zIndex:9999, whiteSpace:"nowrap"
        }}>{msg}</div>
      );
    }

    // ────────── Slider + editable number input ──────────────────────────────────
    function SliderInput({ label, value, min, max, step=1, onChange, suffix="", hint }) {
      const pct = max > min ? ((value - min) / (max - min)) * 100 : 0;
      const onNum = e => {
        const v = Number(e.target.value);
        if (!isNaN(v)) onChange(clamp(v, min, max));
      };
      const wide = suffix === "kr" ? "7.5rem" : (suffix === "st" || suffix === "mån" || suffix === "dgr") ? "4.5rem" : "4rem";
      return (
        <div style={{ marginBottom:"1.5rem" }}>
          <div style={{ marginBottom:"0.45rem", display:"flex", alignItems:"baseline", justifyContent:"space-between", gap:"0.5rem", flexWrap:"wrap" }}>
            <span style={{ fontSize:"0.84rem", fontWeight:500, color:INK2 }}>{label}</span>
            {hint && <span style={{ fontSize:"0.7rem", color:INK3 }}>{hint}</span>}
          </div>
          <div className="slider-row" style={{ display:"flex", alignItems:"center", gap:"0.75rem" }}>
            <div style={{ flex:1 }}>
              <input type="range" min={min} max={max} step={step} value={value}
                onChange={e => onChange(Number(e.target.value))}
                className="informa-slider"
                aria-label={label}
                style={{ background:`linear-gradient(to right,${PINK} ${pct}%,#DFD8CB ${pct}%)` }}
              />
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:"0.67rem", color:INK3, marginTop:"0.15rem" }}>
                <span>{sek(min)}{suffix==="%"?"%":""}</span>
                <span>{sek(max)}{suffix==="%"?"%":""}</span>
              </div>
            </div>
            <div className="slider-number-wrap" style={{ display:"flex", alignItems:"center", gap:"0.2rem", flexShrink:0 }}>
              <input type="number" value={value} min={min} max={max} step={step}
                onChange={onNum} onFocus={e => e.target.select()} className="no-spin"
                style={{
                  width: wide,
                  padding:"0.35rem 0.5rem", borderRadius:"2px",
                  border:`1px solid ${HAIR}`, fontSize:"0.9rem",
                  fontWeight:600, color:PINK, textAlign:"right",
                  fontFamily:"inherit", background:PAPER,
                }}
              />
              {suffix && <span style={{ fontSize:"0.8rem", color:INK3, fontWeight:500, whiteSpace:"nowrap" }}>{suffix}</span>}
            </div>
          </div>
        </div>
      );
    }

    // ────────── Number input (free manual entry, no slider) ───────────────────
    function NumberInput({ label, value, onChange, suffix="", min, max, step=1, hint }) {
      const onNum = e => {
        const raw = e.target.value;
        if (raw === "") { onChange(0); return; }
        const v = Number(raw);
        if (isNaN(v)) return;
        let next = v;
        if (typeof min === "number") next = Math.max(min, next);
        if (typeof max === "number") next = Math.min(max, next);
        onChange(next);
      };
      return (
        <div style={{ marginBottom:"1.25rem" }}>
          <div style={{ marginBottom:"0.4rem", display:"flex", alignItems:"baseline", justifyContent:"space-between", gap:"0.5rem", flexWrap:"wrap" }}>
            <span style={{ fontSize:"0.84rem", fontWeight:500, color:INK2 }}>{label}</span>
            {hint && <span style={{ fontSize:"0.7rem", color:INK3 }}>{hint}</span>}
          </div>
          <div style={{ display:"flex", alignItems:"center", gap:"0.5rem" }}>
            <input type="number" value={value} step={step} onChange={onNum}
              onFocus={e => e.target.select()} className="no-spin"
              style={{
                flex:1, maxWidth:"10rem", padding:"0.55rem 0.75rem", borderRadius:"2px",
                border:`1px solid ${HAIR}`, fontSize:"0.95rem", fontWeight:600,
                color:PINK, textAlign:"right", fontFamily:"inherit", background:PAPER,
              }}
            />
            {suffix && <span style={{ fontSize:"0.85rem", color:INK3, fontWeight:500, whiteSpace:"nowrap" }}>{suffix}</span>}
          </div>
        </div>
      );
    }

    function TextInput({ label, value, onChange, placeholder }) {
      return (
        <div style={{ marginBottom:"1.25rem" }}>
          <div style={{ marginBottom:"0.4rem", fontSize:"0.84rem", fontWeight:500, color:INK2 }}>{label}</div>
          <input type="text" value={value} placeholder={placeholder}
            onChange={e => onChange(e.target.value)}
            style={{
              width:"100%", padding:"0.55rem 0.75rem", borderRadius:"2px",
              border:`1px solid ${HAIR}`, fontSize:"0.95rem",
              fontFamily:"inherit", background:PAPER, color:INK,
            }}
          />
        </div>
      );
    }

    function SelectInput({ label, value, onChange, options }) {
      return (
        <div style={{ marginBottom:"1.25rem" }}>
          <div style={{ marginBottom:"0.4rem", fontSize:"0.84rem", fontWeight:500, color:INK2 }}>{label}</div>
          <select value={value} onChange={e => onChange(e.target.value)}
            style={{
              width:"100%", padding:"0.55rem 0.75rem", borderRadius:"2px",
              border:`1px solid ${HAIR}`, fontSize:"0.95rem",
              fontFamily:"inherit", background:PAPER, color:INK, cursor:"pointer",
            }}>
            {options.map(o => <option key={o} value={o}>{o}</option>)}
          </select>
        </div>
      );
    }

    // ────────── Nollpunktsmätare ───────────────────────────────────────────────
    function BreakEven({ actual, breakeven, unit, label, markLabel = "Nollpunkt" }) {
      const top = Math.max(actual, breakeven, 0.0001) / 0.82;
      const fill = clamp((actual / top) * 100, 0, 100);
      const mark = clamp((breakeven / top) * 100, 0, 100);
      const over = actual >= breakeven;
      return (
        <div style={{ marginTop:"1.5rem" }}>
          <div style={{ display:"flex", justifyContent:"space-between", fontSize:"0.72rem",
            color:"rgba(241,236,227,0.6)", marginBottom:"0.5rem" }}>
            <span>{label}</span><span>{markLabel}</span>
          </div>
          <div style={{ position:"relative", height:3, background:"rgba(241,236,227,0.18)" }}>
            <div style={{ position:"absolute", left:0, top:0, bottom:0, width:fill+"%",
              background: over ? CREAM : "rgba(241,236,227,0.55)", transition:"width 0.25s ease" }} />
            <div style={{ position:"absolute", left:mark+"%", top:-6, bottom:-6, width:2,
              background:ROSA, transition:"left 0.25s ease" }} />
          </div>
        </div>
      );
    }

    // ────────── PIN screen with lockout ────────────────────────────────────────
    function PinScreen({ onUnlock }) {
      const [pin,       setPin]       = useState("");
      const [error,     setError]     = useState(false);
      const [shake,     setShake]     = useState(false);
      const [attempts,  setAttempts]  = useState(0);
      const [lockUntil, setLockUntil] = useState(0);
      const [now,       setNow]       = useState(Date.now());

      useEffect(() => {
        if (lockUntil <= Date.now()) return;
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(id);
      }, [lockUntil]);

      const locked   = now < lockUntil;
      const secsLeft = locked ? Math.ceil((lockUntil - now) / 1000) : 0;

      const tryUnlock = () => {
        if (locked) return;
        if (pin.trim() === "champions") {
          onUnlock();
        } else {
          const next = attempts + 1;
          setAttempts(next);
          setError(true); setShake(true); setPin("");
          setTimeout(() => setShake(false), 460);
          if (next >= 3) {
            setLockUntil(Date.now() + 30000);
            setAttempts(0);
            setNow(Date.now());
          }
        }
      };

      return (
        <div style={{ display:"flex", justifyContent:"center", alignItems:"center", minHeight:"68vh", padding:"1.5rem" }}>
          <div style={{
            background:PAPER, borderRadius:"4px", padding:"3rem 2.5rem",
            width:"100%", maxWidth:400, textAlign:"center",
            border:`1px solid ${HAIR}`,
            animation: shake ? "pinShake 0.46s ease" : "none",
          }}>
            <div style={{ marginBottom:"1.25rem" }}><Wordmark size="2.2rem" /></div>
            <div style={{ fontSize:"1.1rem", color:PINK, marginBottom:"1rem", lineHeight:1 }}>&#10022;</div>
            <h2 style={{ fontFamily:SERIF, fontSize:"1.5rem", fontWeight:400, color:INK, margin:"0 0 0.5rem" }}>
              Internt verktyg
            </h2>
            <p style={{ color:INK3, fontSize:"0.875rem", margin:"0 0 2rem" }}>Ange PIN-kod för att fortsätta</p>

            {locked ? (
              <div style={{ background:"#F5E9E5", border:"1px solid #DDBBB1", borderRadius:"2px", padding:"1.25rem", marginBottom:"1.25rem" }}>
                <p style={{ color:"#9C4F44", fontWeight:600, fontSize:"0.95rem", margin:"0 0 0.25rem" }}>För många försök</p>
                <p style={{ color:"#9C4F44", fontSize:"0.85rem", margin:0 }}>Försök igen om <strong>{secsLeft}</strong> sekunder</p>
              </div>
            ) : (
              <React.Fragment>
                <input
                  type="password" autoCapitalize="none" autoCorrect="off" autoComplete="off" spellCheck={false}
                  value={pin}
                  onChange={e => { setPin(e.target.value); setError(false); }}
                  onKeyDown={e => { if (e.key === "Enter") tryUnlock(); }}
                  placeholder="PIN-kod"
                  autoFocus
                  style={{
                    display:"block", width:"100%", padding:"0.9rem 1rem",
                    borderRadius:"2px",
                    border:`1px solid ${error ? "#9C4F44" : HAIR}`,
                    fontSize:"1.1rem", textAlign:"center", letterSpacing:"0.15em",
                    fontFamily:"inherit", outline:"none",
                    marginBottom: error ? "0.5rem" : "1.25rem",
                    boxSizing:"border-box", color:INK, background:"#fff",
                    transition:"border-color 0.2s",
                  }}
                />
                {error && (
                  <p style={{ color:"#9C4F44", fontSize:"0.8rem", margin:"0 0 1rem" }}>
                    Fel PIN-kod.{(3 - attempts) > 0 ? ` ${3 - attempts} försök kvar.` : ""}
                  </p>
                )}
              </React.Fragment>
            )}

            <button type="button" onClick={tryUnlock} disabled={locked}
              style={{
                width:"100%", padding:"0.9rem",
                background: locked ? "#CFC8BA" : NOIR,
                color:CREAM, border:"none",
                borderRadius:"2px", fontSize:"1rem", fontWeight:600,
                cursor: locked ? "not-allowed" : "pointer",
                fontFamily:"inherit",
                transition:"all 0.2s",
              }}
            >
              {locked ? `Låst ${secsLeft}s` : "Lås upp →"}
            </button>
          </div>
        </div>
      );
    }

    // ── Gemensamma ytor ───────────────────────────────────────────────────────
    const card     = { background:PAPER, borderRadius:"4px", padding:"1.875rem 2rem", border:`1px solid ${HAIR}` };
    const heroCard = { background:NOIR, borderRadius:"4px", padding:"2rem", color:CREAM };
    const eyebrow  = { fontSize:"0.7rem", fontWeight:500, textTransform:"uppercase",
                       letterSpacing:"0.14em", color:INK3, marginBottom:"0.75rem" };
    const bigNum   = { fontFamily:SERIF, fontWeight:300, fontSize:"clamp(2.6rem,7vw,4rem)",
                       lineHeight:1, letterSpacing:"-0.015em", display:"block" };
    const secNum   = { fontFamily:SERIF, fontWeight:400, fontSize:"1.5rem", color:INK, lineHeight:1.1 };
    const outLabel = { fontSize:"0.72rem", fontWeight:600, color:INK3,
                       textTransform:"uppercase", letterSpacing:"0.06em", marginTop:"0.2rem" };
    const split    = { display:"grid", gridTemplateColumns:"1fr 1fr", gap:"2.5rem", alignItems:"start" };

    function KeyRow({ k, v, neg }) {
      return (
        <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between",
          gap:"1rem", padding:"0.8rem 0", borderBottom:`1px solid ${HAIR2}` }}>
          <span style={{ fontSize:"0.86rem", color:INK2 }}>{k}</span>
          <span style={{ fontFamily:SERIF, fontSize:"1.25rem", color: neg ? PINK : INK, whiteSpace:"nowrap" }}>{v}</span>
        </div>
      );
    }

    const dec2 = (n) =>
      new Intl.NumberFormat("sv-SE", { minimumFractionDigits:0, maximumFractionDigits:2 }).format(n)
        .replace(/ | | /g, " ");
    const num1 = (n) => (n < 10 ? dec1(n) : sek(n));

    function Note({ children }) {
      return <p style={{ fontSize:"0.75rem", color:INK3, marginTop:"1rem", lineHeight:1.55 }}>{children}</p>;
    }
    function HeroNote({ children }) {
      return (
        <p style={{ marginTop:"1.4rem", paddingTop:"1.1rem", borderTop:"1px solid rgba(241,236,227,0.18)",
          fontSize:"0.9rem", color:"rgba(241,236,227,0.82)", lineHeight:1.55 }}>{children}</p>
      );
    }
    const Em = ({ children }) => <strong style={{ color:ROSA, fontWeight:500 }}>{children}</strong>;
    const sectionHead = { ...eyebrow, marginTop:"1.75rem", paddingTop:"1.5rem", borderTop:`1px solid ${HAIR2}` };

    // Kanaler och hur de köps. Webb och nyhetsbrev säljs per vecka på titlarna.
    const CHANNELS = [
      { id:"print", name:"Print",      priceLabel:"Pris per införande", unitLabel:"Antal införanden", unitSuffix:"st",
        reachLabel:"Läsare per nummer",        who:"läsare",    defPrice:38000, defUnits:6, maxUnits:24 },
      { id:"web",   name:"Webb",       priceLabel:"Pris per vecka",     unitLabel:"Antal veckor",     unitSuffix:"veckor",
        reachLabel:"Unika besökare per vecka", who:"besökare",  defPrice:25000, defUnits:4, maxUnits:52 },
      { id:"nl",    name:"Nyhetsbrev", priceLabel:"Pris per vecka",     unitLabel:"Antal veckor",     unitSuffix:"veckor",
        reachLabel:"Mottagare",                who:"mottagare", defPrice:20000, defUnits:4, maxUnits:52 },
    ];

    // Publika siffror per titel och kanal. reach 0 = ingen publik siffra, fylls i från mediakit.
    const NONE = { reach:0, source:"Ingen publik siffra, fyll i från mediakit" };
    const TITLE_DATA = {
      "Läkartidningen": {
        print: { reach:48900,  source:"TS-upplaga 48 900 ex, 21 nr/år" },
        web:   { reach:200000, imps:410000, source:"200 000 unika besökare och 410 000 visningar per vecka (2025)" },
        nl:    { reach:47800,  open:46, source:"47 800 mottagare, 46 % öppningsgrad, 5 utskick per vecka (2025)" },
      },
      "Dagens Samhälle": {
        print: { reach:41000,  source:"41 000 läsare per vecka i print (Orvesto 2024)" },
        web:   { reach:41000,  source:"41 000 unika webbläsare per vecka (Orvesto)" },
        nl:    { reach:30000,  source:"Cirka 30 000 prenumeranter" },
      },
      "Ny Teknik": {
        print: { reach:162000, source:"162 000 läsare per utgåva (Orvesto 2025)" },
        web:   { reach:304808, source:"304 808 aktiva användare per vecka (Google Analytics)" },
        nl:    NONE,
      },
    };
    const titleData = (t, ch) => ((TITLE_DATA[t] || {})[ch]) || NONE;

    const channelDefaults = (t) => {
      const o = {};
      CHANNELS.forEach(c => {
        const d = titleData(t, c.id);
        o[c.id] = { on: c.id === "print", price: c.defPrice, units: c.defUnits,
          reach: d.reach || 0, imps: d.imps || 0, open: d.open || 0 };
      });
      return o;
    };

    // ══════════════════════════════════════════════════════════════════════════
    // 1. För annonsörer: vad krävs för att kampanjen ska gå ihop?
    //
    //   Kalkylen gissar inte på respons eller konvertering. Den bygger bara på
    //   det annonsören vet: vad kampanjen kostar per kanal och vad en ny kund
    //   är värd. Svaret är hur många nya kunder som krävs.
    //
    //   kostnad per kanal = pris × antal (införanden eller veckor)
    //   räckvidd per kanal = läsare, unika besökare eller mottagare
    //   bruttovinst/kund   = snittaffär per år × antal år × bruttomarginal
    //   nollpunkt          = total kostnad / bruttovinst per kund
    // ══════════════════════════════════════════════════════════════════════════
    function AdvertiserCalc() {
      const [company, setCompany]  = useLS("med4_company", "");
      const [title,   setTitleRaw] = useLS("med4_title",   "Läkartidningen");
      const [ch,      setCh]       = useLS("med4_channels", channelDefaults("Läkartidningen"));
      const [order,   setOrder]    = useLS("med4_order",   120000);
      const [years,   setYears]    = useLS("med4_years",        3);
      const [margin,  setMargin]   = useLS("med4_margin",      45);
      const [toast,   setToast]    = useState(null);

      const upd = (id, patch) => setCh(Object.assign({}, ch, { [id]: Object.assign({}, ch[id], patch) }));
      const setTitle = (t) => {
        setTitleRaw(t);
        const next = {};
        CHANNELS.forEach(c => {
          const d = titleData(t, c.id);
          next[c.id] = Object.assign({}, ch[c.id], { reach: d.reach || 0, imps: d.imps || 0, open: d.open || 0 });
        });
        setCh(next);   // titel utan siffra tömmer fälten, så att fel titels räckvidd aldrig ligger kvar
      };

      const perCust = order * years * (margin / 100);
      const rows = CHANNELS.filter(c => ch[c.id] && ch[c.id].on).map(c => {
        const s = ch[c.id];
        const cost = s.price * s.units;
        const audience = s.reach;
        return {
          c, s, cost, audience,
          cpm: audience > 0 ? s.price / (audience / 1000) : 0,           // per införande eller vecka
          effCpm: c.id === "web" && s.imps > 0 ? s.price / (s.imps / 1000) : 0,
          opens: c.id === "nl" && s.open > 0 ? s.reach * (s.open / 100) : 0,
        };
      });
      const cost      = rows.reduce((a, r) => a + r.cost, 0);
      const be        = perCust > 0 ? cost / perCust : 0;
      const single    = rows.length === 1 ? rows[0] : null;
      const oneIn     = single && be > 0 ? single.audience / be : 0;
      const firstPlus = Math.max(1, Math.ceil(be - 1e-9));
      const missingReach = rows.some(r => r.s.reach <= 0);
      const ready     = rows.length > 0 && perCust > 0 && cost > 0;
      const impossible = ready && single && single.audience > 0 && be > single.audience;

      const levels   = Array.from(new Set([1, 2, 3, 5, 10, firstPlus])).sort((a, b) => a - b).slice(0, 6);
      const outcomes = levels.map(n => ({ n, net: n * perCust - cost, roi: cost > 0 ? ((n * perCust - cost) / cost) * 100 : 0 }));

      const aBe  = useCountUp(be);
      const aOne = useCountUp(oneIn);

      const withReach = rows.filter(r => r.audience > 0);
      const joinSv = (parts) => parts.length <= 1 ? (parts[0] || "") : parts.slice(0, -1).join(", ") + " och " + parts[parts.length - 1];
      const reachText = (f) => {
        return joinSv(withReach.map(r => f(r.audience) + " " + (r.c.id === "nl" ? "nyhetsbrevsmottagare" : r.c.who)));
      };
      const reachSentence = () => reachText(sek);
      const plusLine = "Med " + firstPlus + (firstPlus === 1 ? " ny kund" : " nya kunder") + " är ni " + sek(firstPlus * perCust - cost) + " kr plus.";

      function generatePDF() {
        const now = new Date();
        const dateStr = now.toLocaleDateString('sv-SE', {year:'numeric', month:'long', day:'numeric'});
        const fmt = (n) => new Intl.NumberFormat('sv-SE').format(Math.round(n)).replace(/[   ]/g,' ');
        const f1  = (n) => (n < 100 ? n.toFixed(1).replace('.', ',') : fmt(n));
        const f2  = (n) => new Intl.NumberFormat('sv-SE',{maximumFractionDigits:2}).format(n);
        const logo = '<div style="font-family:Newsreader,Georgia,serif;font-weight:400;font-size:26px;color:#1A1916;line-height:1">Informa<span style="color:#E85B7D">.</span></div>';
        const css = `
          @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Inter:wght@400;500;600&display=swap');
          *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
          html, body { font-family: 'Inter', system-ui, sans-serif; color: #1A1916; background: #F1ECE3;
            -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          .doc-hdr { display:flex; justify-content:space-between; align-items:flex-start;
            padding-bottom:14px; border-bottom:1px solid rgba(26,25,22,0.18); margin-bottom:24px; }
          .doc-hdr-r { text-align:right; font-size:11px; color:#5C5852; line-height:1.6; }
          .eyeb { font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:#8A8579; font-weight:500; margin-bottom:8px; }
          h1 { font-family:'Newsreader',Georgia,serif; font-weight:300; font-size:36px; line-height:1.1; letter-spacing:-0.01em; margin-bottom:10px; }
          .lede { font-size:11.5px; color:#5C5852; line-height:1.6; max-width:82%; margin-bottom:22px; }
          .hero { background:#1E1B19; color:#F1ECE3; padding:24px 28px; margin-bottom:22px;
            display:grid; grid-template-columns:1fr 1.3fr; gap:26px; align-items:end; }
          .hero .eyeb { color:rgba(241,236,227,0.62); }
          .hero .big { font-family:'Newsreader',Georgia,serif; font-weight:300; font-size:58px; line-height:1; letter-spacing:-0.02em; }
          .hero .unit { font-family:'Newsreader',Georgia,serif; font-style:italic; font-weight:300; font-size:17px; color:rgba(241,236,227,0.76); margin-top:6px; }
          .hero .note { font-size:11.5px; color:rgba(241,236,227,0.86); line-height:1.6; }
          .hero .note b { color:#FA7896; font-weight:500; }
          table { width:100%; border-collapse:collapse; margin-bottom:20px; }
          th { font-size:8.5px; letter-spacing:0.1em; text-transform:uppercase; color:#8A8579; font-weight:600;
            text-align:right; padding:7px 8px; border-bottom:1px solid rgba(26,25,22,0.18); }
          td { padding:7px 8px; border-bottom:1px solid rgba(26,25,22,0.08); text-align:right;
            font-family:'Newsreader',Georgia,serif; font-size:14px; white-space:nowrap; }
          th:first-child, td:first-child { text-align:left; }
          td:first-child { font-family:'Inter',sans-serif; font-size:11px; color:#5C5852; white-space:normal; }
          tr.sum td { border-top:1px solid rgba(26,25,22,0.18); font-weight:600; } tr.sum td:first-child { color:#1A1916; }
          tr.first td { font-weight:600; } tr.first td:first-child { color:#1A1916; }
          .neg { color:#E85B7D; }
          .src { font-size:8.5px; color:#8A8579; margin:-14px 0 18px; line-height:1.5; }
          .about { border-top:1px solid rgba(26,25,22,0.18); padding-top:12px; }
          .about p { font-size:10px; color:#5C5852; line-height:1.6; max-width:86%; }
          .foot { position:absolute; bottom:46px; left:76px; right:76px; display:flex; justify-content:space-between;
            font-size:9px; color:#8A8579; border-top:1px solid rgba(26,25,22,0.08); padding-top:10px; }
        `;
        const chanRows = rows.map(r =>
          '<tr><td>' + r.c.name + '</td><td>' + fmt(r.s.price) + ' kr</td><td>' + r.s.units + ' ' + r.c.unitSuffix + '</td>' +
          '<td>' + fmt(r.cost) + ' kr</td><td>' + (r.audience > 0 ? fmt(r.audience) + ' ' + r.c.who : 'saknas') + '</td></tr>').join('');
        const chanTable = '<table><thead><tr><th>Kanal</th><th>Pris</th><th>Antal</th><th>Kostnad</th><th>Når</th></tr></thead><tbody>' +
          chanRows + '<tr class="sum"><td>Totalt</td><td></td><td></td><td>' + fmt(cost) + ' kr</td><td></td></tr></tbody></table>';
        const sources = rows.map(r => r.c.name + ': ' + titleData(title, r.c.id).source).join(' · ');
        const outTable = '<table><thead><tr><th>Om kampanjen ger</th><th>Bruttovinst</th><th>Netto</th><th>Avkastning</th></tr></thead><tbody>' +
          outcomes.map(o => '<tr' + (o.n === firstPlus ? ' class="first"' : '') + '><td>' + o.n + (o.n === 1 ? ' ny kund' : ' nya kunder') + '</td>' +
            '<td>' + fmt(o.n * perCust) + ' kr</td><td' + (o.net < 0 ? ' class="neg"' : '') + '>' + fmt(o.net) + ' kr</td>' +
            '<td' + (o.roi < 0 ? ' class="neg"' : '') + '>' + fmt(o.roi) + ' %</td></tr>').join('') + '</tbody></table>';
        const heroNote = single && single.audience > 0
          ? 'Det motsvarar <b>1 av ' + fmt(oneIn) + '</b> ' + single.c.who + '. '
          : withReach.length > 0
          ? 'Kampanjen når ' + reachText(fmt) + '. '
          : '';

        const page1 =
          '<div class="page" style="position:relative;">' +
            '<div class="doc-hdr">' + logo + '<div class="doc-hdr-r">' + (company ? company + '<br>' : '') + title + '<br>' + dateStr + '</div></div>' +
            '<div class="eyeb">Annonskalkyl</div>' +
            '<h1>Vad kampanjen behöver ge tillbaka<span style="color:#E85B7D">.</span></h1>' +
            '<div class="lede">Kalkylen bygger bara på två saker ni vet: vad kampanjen kostar och vad en ny kund är värd för er. ' +
              'Den lovar inget utfall. Den visar hur många nya kunder som krävs för att kampanjen ska gå ihop.</div>' +
            '<div class="hero"><div><div class="eyeb">Kampanjen går jämnt ut vid</div><div class="big">' + f1(be) + '</div><div class="unit">nya kunder</div></div>' +
              '<div class="note">' + heroNote + 'Med ' + firstPlus + (firstPlus === 1 ? ' ny kund' : ' nya kunder') + ' är ni ' + fmt(firstPlus * perCust - cost) + ' kr plus.</div></div>' +
            '<div class="eyeb">Kampanjen</div>' + chanTable +
            '<div class="src">Räckvidd: ' + sources + '</div>' +
            '<div class="eyeb">Er affär</div>' +
            '<table><tbody>' +
              '<tr><td>Bruttovinst per ny kund</td><td>' + fmt(order) + ' kr/år × ' + f2(years) + ' år × ' + margin + ' %</td><td>' + fmt(perCust) + ' kr</td></tr>' +
              '<tr class="sum"><td>Nya kunder som krävs</td><td>' + fmt(cost) + ' kr ÷ ' + fmt(perCust) + ' kr</td><td>' + f1(be) + '</td></tr>' +
            '</tbody></table>' +
            '<div class="eyeb">Vad kampanjen ger</div>' + outTable +
            '<div class="about"><div class="eyeb">Om Informa</div>' +
              '<p>Informa driver medieförsäljningen åt några av Sveriges starkaste medievarumärken. ' +
              'Vi har gjort det sedan 1977 och kan läsarna, annonsörerna och marknaden. ' +
              'Vi säger som det är, även när svaret är att annonsen inte är rätt för er just nu.</p></div>' +
            '<div class="foot"><span>Informa. Sveriges mest erfarna säljpartner</span><span>media@informa.se</span></div>' +
          '</div>';

        const container = document.createElement('div');
        container.style.cssText = 'position:fixed;left:-9999px;top:0;width:794px;background:#F1ECE3;';
        container.innerHTML = '<style>.page{width:794px!important;min-height:1123px;height:1123px!important;padding:54px 76px;overflow:hidden;box-sizing:border-box;background:#F1ECE3}</style><style>' + css + '</style>' + page1;
        document.body.appendChild(container);
        setToast('Genererar PDF…');
        const loadLib = (src) => new Promise((res, rej) => {
          if (document.querySelector('script[src="' + src + '"]')) { res(); return; }
          const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        });
        Promise.all([
          loadLib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
          loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
          document.fonts.ready
        ]).then(function() {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation:'portrait', unit:'mm', format:'a4' });
          return window.html2canvas(container.querySelector('.page'), { scale:2, useCORS:true, allowTaint:true,
            backgroundColor:'#F1ECE3', width:794, height:1123 }).then(function(c1) {
            pdf.addImage(c1.toDataURL('image/jpeg', 0.93), 'JPEG', 0, 0, 210, 297);
            document.body.removeChild(container);
            pdf.save('Informa-annonskalkyl-' + now.toLocaleDateString('sv-SE') + '.pdf');
            setToast(null);
          });
        }).catch(function() {
          if (container.parentNode) document.body.removeChild(container);
          setToast('Fel vid PDF-generering');
          setTimeout(function() { setToast(null); }, 3000);
        });
      }

      const th  = { fontSize:"0.65rem", letterSpacing:"0.1em", textTransform:"uppercase", color:INK3,
        fontWeight:600, padding:"0.5rem 0.4rem", borderBottom:`1px solid ${HAIR}`, textAlign:"right" };
      const tdc = { padding:"0.6rem 0.4rem", borderBottom:`1px solid ${HAIR2}`, textAlign:"right",
        fontFamily:SERIF, fontSize:"1.05rem" };

      return (
        <div style={{ maxWidth:1000, margin:"0 auto" }}>
          {toast && <Toast msg={toast} onDone={() => setToast(null)} />}
          <div className="print-header">
            <Wordmark size="2rem" />
            <div style={{ fontSize:"1rem", color:INK2 }}>Annonskalkyl · {title} · {new Date().toLocaleDateString("sv-SE")}</div>
          </div>

          <div style={{ textAlign:"center", marginBottom:"2.75rem" }}>
            <h1 style={{ fontFamily:SERIF, fontSize:"clamp(1.85rem,5vw,3.1rem)", fontWeight:300,
              color:INK, margin:"0 0 1rem", lineHeight:1.12, letterSpacing:"-0.01em" }}>
              Vad kampanjen behöver ge tillbaka<span style={{ color:PINK }}>.</span>
            </h1>
            <p style={{ color:INK2, fontSize:"1rem", maxWidth:"56ch", margin:"0 auto" }}>
              Välj kanaler, fyll i vad de kostar och vad en ny kund är värd för er.
              Kalkylen visar hur många nya kunder som krävs, utan att gissa på respons.
            </p>
          </div>

          <div className="split" style={split}>
            <div style={card}>
              <div style={eyebrow}>Kampanjen</div>
              <TextInput label="Annonsör" value={company} onChange={setCompany} placeholder="Företagsnamn" />
              <SelectInput label="Titel" value={title} onChange={setTitle} options={TITLES} />

              <div style={{ marginBottom:"1.25rem" }}>
                <div style={{ marginBottom:"0.4rem", fontSize:"0.84rem", fontWeight:500, color:INK2 }}>Kanaler</div>
                <div style={{ display:"flex", border:`1px solid ${HAIR}`, borderRadius:"2px", padding:"3px", gap:"2px" }}>
                  {CHANNELS.map(c => {
                    const on = ch[c.id] && ch[c.id].on;
                    return (
                      <button key={c.id} type="button" aria-pressed={on ? "true" : "false"} onClick={() => upd(c.id, { on: !on })}
                        style={{ flex:1, padding:"0.5rem", borderRadius:"2px", border:"none", cursor:"pointer",
                          fontFamily:"inherit", fontSize:"0.85rem", fontWeight:500,
                          background: on ? NOIR : "transparent", color: on ? CREAM : INK2, transition:"all 0.2s" }}>
                        {on ? "✓ " : ""}{c.name}
                      </button>
                    );
                  })}
                </div>
              </div>

              {CHANNELS.filter(c => ch[c.id] && ch[c.id].on).map(c => {
                const s = ch[c.id];
                return (
                  <div key={c.id}>
                    <div style={sectionHead}>{c.name}</div>
                    <NumberInput label={c.priceLabel} value={s.price} onChange={v => upd(c.id, { price: v })} suffix="kr" min={0} step={1000} />
                    <SliderInput label={c.unitLabel} value={s.units} min={1} max={c.maxUnits} step={1}
                      onChange={v => upd(c.id, { units: v })} suffix={c.unitSuffix === "st" ? "st" : "v"} />
                    <NumberInput label={c.reachLabel} value={s.reach} onChange={v => upd(c.id, { reach: v })} suffix="st" min={0} step={1000}
                      hint={titleData(title, c.id).source} />
                    {c.id === "web" && (
                      <NumberInput label="Visningar per vecka" value={s.imps} onChange={v => upd(c.id, { imps: v })} suffix="st" min={0} step={10000}
                        hint="Valfritt, ger kostnad per tusen visningar" />
                    )}
                    {c.id === "nl" && (
                      <SliderInput label="Öppningsgrad" value={s.open} min={0} max={100} step={1}
                        onChange={v => upd(c.id, { open: v })} suffix="%" hint="Valfritt, från mediakit" />
                    )}
                  </div>
                );
              })}

              <div style={sectionHead}>Er affär</div>
              <NumberInput label="Snittaffär per kund och år" value={order} onChange={setOrder} suffix="kr" min={0} step={5000} />
              <NumberInput label="Antal år en kund stannar" value={years} onChange={setYears} suffix="år" min={0.5} step={0.5} />
              <SliderInput label="Bruttomarginal" value={margin} min={0} max={100} step={1} onChange={setMargin} suffix="%" />
            </div>

            <div>
              <div style={heroCard}>
                <div style={{ ...eyebrow, color:"rgba(241,236,227,0.62)" }}>Kampanjen går jämnt ut vid</div>
                <span style={bigNum}>{ready ? num1(aBe) : "n/a"}</span>
                <div style={{ fontFamily:SERIF, fontStyle:"italic", fontWeight:300,
                  fontSize:"1.35rem", color:"rgba(241,236,227,0.76)", marginTop:"0.6rem" }}>
                  nya kunder
                </div>
                <HeroNote>
                  {rows.length === 0
                    ? <React.Fragment>Välj minst en kanal.</React.Fragment>
                    : !ready
                    ? <React.Fragment>Fyll i pris och vad en kund är värd så räknar vi ut nollpunkten.</React.Fragment>
                    : impossible
                    ? <React.Fragment>Det är fler kunder än det finns {single.c.who}. Kampanjen kostar för mycket i förhållande till vad en kund är värd.</React.Fragment>
                    : single && single.audience > 0
                    ? <React.Fragment>Det motsvarar <Em>1 av {sek(aOne)}</Em> {single.c.who}. Med {firstPlus} {firstPlus === 1 ? "ny kund" : "nya kunder"} är ni {sek(firstPlus * perCust - cost)} kr plus.</React.Fragment>
                    : withReach.length > 0
                    ? <React.Fragment>Kampanjen når {reachSentence()}. {plusLine}</React.Fragment>
                    : <React.Fragment>{plusLine} Fyll i räckvidd från mediakit så ser ni också hur stor andel av läsarna det motsvarar.</React.Fragment>}
                </HeroNote>
              </div>

              {rows.length > 0 && (
                <div style={{ ...card, marginTop:"1.25rem" }}>
                  <div style={eyebrow}>Per kanal</div>
                  {rows.map(r => (
                    <div key={r.c.id} style={{ padding:"0.7rem 0", borderBottom:`1px solid ${HAIR2}` }}>
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", gap:"1rem" }}>
                        <span style={{ fontSize:"0.9rem", color:INK, fontWeight:600 }}>{r.c.name}</span>
                        <span style={{ fontFamily:SERIF, fontSize:"1.25rem" }}>{sek(r.cost)} kr</span>
                      </div>
                      <div style={{ fontSize:"0.75rem", color:INK3, marginTop:"0.25rem", lineHeight:1.6 }}>
                        {sek(r.s.price)} kr × {r.s.units} {r.c.unitSuffix} · {r.audience > 0
                          ? "når " + sek(r.audience) + " " + r.c.who + (r.c.id === "print" ? " per nummer" : " per vecka")
                          : "räckvidd saknas"}
                        {r.audience > 0 && <React.Fragment> · {sek(r.cpm)} kr per tusen {r.c.who} och {r.c.id === "print" ? "införande" : "vecka"}</React.Fragment>}
                        {r.effCpm > 0 && <React.Fragment> · {sek(r.effCpm)} kr per tusen visningar</React.Fragment>}
                        {r.opens > 0 && <React.Fragment> · {sek(r.opens)} öppnar varje utskick</React.Fragment>}
                      </div>
                    </div>
                  ))}
                  <KeyRow k="Total kampanjkostnad" v={sek(cost) + " kr"} />
                  <KeyRow k="Bruttovinst per ny kund" v={sek(perCust) + " kr"} />
                </div>
              )}

              <div style={{ ...card, marginTop:"1.25rem" }}>
                <div style={eyebrow}>Vad kampanjen ger</div>
                <div style={{ overflowX:"auto" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse", minWidth:320 }}>
                    <thead><tr>
                      <th style={{ ...th, textAlign:"left" }}>Om kampanjen ger</th>
                      <th style={th}>Netto</th>
                      <th style={th}>Avkastning</th>
                    </tr></thead>
                    <tbody>
                      {outcomes.map(o => (
                        <tr key={o.n}>
                          <td style={{ ...tdc, textAlign:"left", fontFamily:"inherit", fontSize:"0.85rem",
                            color: o.n === firstPlus ? INK : INK2, fontWeight: o.n === firstPlus ? 600 : 400 }}>
                            {o.n === firstPlus && <span style={{ color:PINK }}>→ </span>}{o.n} {o.n === 1 ? "ny kund" : "nya kunder"}
                          </td>
                          <td style={{ ...tdc, color: o.net < 0 ? PINK : INK }}>{sek(o.net)} kr</td>
                          <td style={{ ...tdc, color: o.roi < 0 ? PINK : INK }}>{sek(o.roi)} %</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              <div className="cta-row no-print" style={{ display:"flex", gap:"0.75rem", marginTop:"1.25rem" }}>
                <button type="button" onClick={generatePDF} disabled={!ready}
                  style={{ flex:1, padding:"0.85rem 1.5rem", background: ready ? NOIR : "#CFC8BA", color:CREAM, border:"none",
                    borderRadius:"2px", fontSize:"0.95rem", fontWeight:600, cursor: ready ? "pointer" : "not-allowed", fontFamily:"inherit" }}>
                  Ladda ner som PDF
                </button>
                <button type="button" onClick={() => window.print()}
                  style={{ padding:"0.85rem 1.5rem", background:"transparent", color:INK, border:`1px solid ${HAIR}`,
                    borderRadius:"2px", fontSize:"0.95rem", fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>
                  Skriv ut
                </button>
              </div>

              <Note>
                Vi räknar på bruttovinst, inte omsättning, eftersom det är vinsten som ska betala kampanjen.
                {rows.length > 1 && " Samma person kan finnas i flera kanaler, så räckvidden per kanal läggs inte ihop."}
                {missingReach && " En kanal saknar räckvidd. Nollpunkten stämmer ändå, men räckvidden behövs för att visa hur stor andel av läsarna det motsvarar."}

    // ══════════════════════════════════════════════════════════════════════════
    // 2. Rekrytering: två vägar till samma tillsättning
    //
    //   Väg A, annons först:  annonspris + om den inte räcker, byrå efteråt
    //   Väg B, byrå direkt:   byråarvode
    //   Båda vägarna kostar dessutom vakansdagar tills tjänsten är tillsatt.
    //
    //   Kostnad A = pris + (1 − p) × arvode + dagkostnad × (dagar_annons + (1 − p) × dagar_byrå)
    //   Kostnad B = arvode + dagkostnad × dagar_byrå
    //   Nollpunkt p* = (pris + dagkostnad × dagar_annons) / (arvode + dagkostnad × dagar_byrå)
    // ══════════════════════════════════════════════════════════════════════════
    function recruitModel(q, p) {
      const pp    = clamp(p, 0, 100) / 100;
      const daysA = q.daysAd + (1 - pp) * q.daysAgency;
      const costA = q.price + (1 - pp) * q.agency + q.dayCost * daysA;
      const costB = q.agency + q.dayCost * q.daysAgency;
      const denom = q.agency + q.dayCost * q.daysAgency;
      return {
        daysA, costA, costB, saving: costB - costA,
        be: denom > 0 ? ((q.price + q.dayCost * q.daysAd) / denom) * 100 : Infinity,
      };
    }

    function RecruitCalc() {
      const [title,      setTitle]      = useLS("med2_rek_title",      "Läkartidningen");
      const [price,      setPrice]      = useLS("med2_rek_price",       24000);
      const [apps,       setApps]       = useLS("med2_rek_apps",            6);
      const [prob,       setProb]       = useLS("med2_rek_prob",           50);
      const [daysAd,     setDaysAd]     = useLS("med2_rek_daysAd",         40);
      const [agency,     setAgency]     = useLS("med2_rek_agency",     180000);
      const [daysAgency, setDaysAgency] = useLS("med2_rek_daysAgency",     75);
      const [dayCost,    setDayCost]    = useLS("med2_rek_dayCost",      4500);
      const [toast,      setToast]      = useState(null);

      const Q = { price, daysAd, agency, daysAgency, dayCost };
      const r = recruitModel(Q, prob);
      const perApp = apps > 0 ? price / apps : 0;
      const noAlt  = agency <= 0 && daysAgency <= 0;
      const beOver = !noAlt && r.be > 100;
      const scenarios = [25, 50, 75].map(p => Object.assign({ p }, recruitModel(Q, p)));

      const aBe   = useCountUp(isFinite(r.be) ? Math.min(r.be, 999) : 999);
      const aSave = useCountUp(r.saving);

      const handleCopy = () => {
        const lines = [
          "INFORMA · Rekryteringskalkyl",
          "Titel: " + title,
          "Datum: " + new Date().toLocaleDateString("sv-SE"),
          "",
          "Annonspris: " + sek(price) + " kr",
          "Byråarvode: " + sek(agency) + " kr",
          "Vakanskostnad per dag: " + sek(dayCost) + " kr",
          "Dagar till tillsättning via annons: " + daysAd,
          "Dagar till tillsättning via byrå: " + daysAgency,
          "Chans att annonsen ger rätt person: " + prob + " %",
          "",
          "Annonsen lönar sig om chansen är minst: " + (beOver ? "över 100 % (lönar sig inte)" : Math.round(r.be) + " %"),
          "Väntad kostnad, annons först: " + sek(r.costA) + " kr",
          "Kostnad, byrå direkt: " + sek(r.costB) + " kr",
          "Väntad besparing: " + sek(r.saving) + " kr",
          "Kostnad per kvalificerad sökande: " + (apps > 0 ? sek(perApp) + " kr" : "n/a"),
        ].join("\n");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(lines).then(() => setToast("Kopierat till urklipp"), () => setToast("Kunde inte kopiera"));
        } else { setToast("Kunde inte kopiera"); }
      };

      const th = { fontSize:"0.65rem", letterSpacing:"0.1em", textTransform:"uppercase", color:INK3,
        fontWeight:600, padding:"0.5rem 0.4rem", borderBottom:`1px solid ${HAIR}` };
      const td = { padding:"0.6rem 0.4rem", borderBottom:`1px solid ${HAIR2}`, textAlign:"right",
        fontFamily:SERIF, fontSize:"1.05rem" };

      return (
        <div style={{ maxWidth:1000, margin:"0 auto" }}>
          {toast && <Toast msg={toast} onDone={() => setToast(null)} />}

          <div style={{ textAlign:"center", marginBottom:"2.5rem" }}>
            <h1 style={{ fontFamily:SERIF, fontSize:"clamp(1.6rem,3.5vw,2.4rem)", fontWeight:300,
              color:INK, letterSpacing:"-0.01em", marginBottom:"0.5rem" }}>
              Annons först eller <em style={{ color:PINK, fontWeight:300 }}>byrå</em> direkt
            </h1>
            <p style={{ color:INK2, fontSize:"0.95rem", maxWidth:"54ch", margin:"0 auto" }}>
              Två vägar till samma tillsättning. Räcker inte annonsen går ni till byrå efteråt,
              och varje dag tjänsten står tom kostar pengar.
            </p>
          </div>

          <div className="split" style={split}>
            <div style={card}>
              <div style={eyebrow}>Annonsen</div>
              <SelectInput label="Titel" value={title} onChange={setTitle} options={TITLES} />
              <NumberInput label="Annonspris" value={price} onChange={setPrice} suffix="kr" min={0} step={1000} />
              <SliderInput label="Chans att annonsen ger rätt person" value={prob} min={0} max={100} step={5}
                onChange={setProb} suffix="%" />
              <NumberInput label="Dagar till tillsättning via annons" value={daysAd} onChange={setDaysAd} suffix="dgr" min={0} step={5}
                hint="Ansökningstid, intervjuer och beslut" />
              <NumberInput label="Kvalificerade sökande ni väntar er" value={apps} onChange={setApps} suffix="st" min={0} step={1}
                hint="De som matchar kravprofilen" />

              <div style={sectionHead}>Byrå</div>
              <NumberInput label="Byråarvode" value={agency} onChange={setAgency} suffix="kr" min={0} step={10000} />
              <NumberInput label="Dagar till tillsättning via byrå" value={daysAgency} onChange={setDaysAgency} suffix="dgr" min={0} step={5} />

              <div style={sectionHead}>Vakansen</div>
              <NumberInput label="Vad en dag utan personen kostar" value={dayCost} onChange={setDayCost} suffix="kr" min={0} step={500}
                hint="Hyrpersonal, övertid, utebliven intäkt" />
            </div>

            <div>
              <div style={heroCard}>
                <div style={{ ...eyebrow, color:"rgba(241,236,227,0.62)" }}>
                  Annonsen lönar sig om chansen att den ger rätt person är minst
                </div>
                <span style={bigNum}>{noAlt ? "n/a" : beOver ? "över 100 %" : sek(aBe) + " %"}</span>
                <BreakEven actual={prob} breakeven={Math.min(r.be, 100)} label="Er bedömning" />
                <HeroNote>
                  {noAlt
                    ? <React.Fragment>Fyll i byråarvode och dagar till tillsättning via byrå. Utan ett alternativ finns inget att jämföra annonsen med.</React.Fragment>
                    : beOver
                    ? <React.Fragment>Med de här siffrorna lönar sig annonsen inte ens om den alltid fungerar. Annonsvägen tar för lång tid eller kostar för mycket jämfört med byrån.</React.Fragment>
                    : <React.Fragment>Ni bedömer chansen till {prob} %. Då är den väntade {r.saving >= 0 ? "besparingen" : "merkostnaden"} <Em>{sek(Math.abs(aSave))} kr</Em> jämfört med att gå direkt till byrå.</React.Fragment>}
                </HeroNote>
              </div>

              <div style={{ ...card, marginTop:"1.25rem" }}>
                <div style={eyebrow}>Jämförelsen</div>
                <KeyRow k="Byrå direkt, kostnad" v={sek(r.costB) + " kr"} />
                <KeyRow k="Annons först, väntad kostnad" v={sek(r.costA) + " kr"} />
                <KeyRow k="Byrå direkt, dagar till tillsättning" v={sek(daysAgency)} />
                <KeyRow k="Annons först, väntat antal dagar" v={sek(r.daysA)} />
                <KeyRow k="Kostnad per kvalificerad sökande" v={apps > 0 ? sek(perApp) + " kr" : "n/a"} />
                <div style={{ display:"flex", alignItems:"baseline", justifyContent:"space-between", gap:"1rem", paddingTop:"0.8rem" }}>
                  <span style={{ fontSize:"0.86rem", color:INK2 }}>Väntad besparing med annons först</span>
                  <span style={{ fontFamily:SERIF, fontSize:"1.6rem", color: r.saving < 0 ? PINK : INK }}>{sek(r.saving)} kr</span>
                </div>
              </div>

              <div style={{ ...card, marginTop:"1.25rem" }}>
                <div style={eyebrow}>Om chansen blir en annan</div>
                <div style={{ overflowX:"auto" }}>
                  <table style={{ width:"100%", borderCollapse:"collapse", minWidth:320 }}>
                    <thead><tr>
                      <th style={{ ...th, textAlign:"left" }}>Chans</th>
                      <th style={{ ...th, textAlign:"right" }}>Annons först</th>
                      <th style={{ ...th, textAlign:"right" }}>Byrå direkt</th>
                      <th style={{ ...th, textAlign:"right" }}>Besparing</th>
                    </tr></thead>
                    <tbody>
                      {scenarios.map(s => (
                        <tr key={s.p}>
                          <td style={{ ...td, textAlign:"left", fontFamily:"inherit", fontSize:"0.85rem", color:INK2 }}>{s.p} %</td>
                          <td style={td}>{sek(s.costA)} kr</td>
                          <td style={td}>{sek(s.costB)} kr</td>
                          <td style={{ ...td, color: s.saving < 0 ? PINK : INK }}>{sek(s.saving)} kr</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              <div className="cta-row no-print" style={{ display:"flex", gap:"0.75rem", marginTop:"1.25rem" }}>
                <button type="button" onClick={handleCopy}
                  style={{ flex:1, padding:"0.85rem 1.5rem", background:NOIR, color:CREAM, border:"none",
                    borderRadius:"2px", fontSize:"0.95rem", fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>
                  Kopiera kalkylen
                </button>
                <button type="button" onClick={() => window.print()}
                  style={{ padding:"0.85rem 1.5rem", background:"transparent", color:INK, border:`1px solid ${HAIR}`,
                    borderRadius:"2px", fontSize:"0.95rem", fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>
                  Skriv ut
                </button>
              </div>

              <Note>
                Räcker inte annonsen går ni till byrå efteråt. Då betalar ni båda, och byråns dagar läggs på annonsens.
                Det är därför chansen avgör allt.
              </Note>
            </div>
          </div>
        </div>
      );
    }

    // ══════════════════════════════════════════════════════════════════════════
    // 3. Säljstöd internt: vad affären ger Informa per nedlagd timme
    //
    //   intäkt     = provision × annonsvärde, eller fast arvode per införande
    //   timmar     = säljtid för affären + hantering per införande × antal
    //   bedömning  = intäkt per timme mot vårt mål per timme
    // ══════════════════════════════════════════════════════════════════════════
    function InternalCalc() {
      const [client,    setClient]    = useLS("med2_int_client",    "");
      const [seller,    setSeller]    = useLS("med2_int_seller",    "");
      const [title,     setTitle]     = useLS("med2_int_title",     "Läkartidningen");
      const [model,     setModel]     = useLS("med2_int_model",     "provision");
      const [revenue,   setRevenue]   = useLS("med2_int_revenue",   38000);
      const [runs,      setRuns]      = useLS("med2_int_runs",          6);
      const [commPct,   setCommPct]   = useLS("med2_int_commPct",      25);
      const [fixedFee,  setFixedFee]  = useLS("med2_int_fixedFee",   9000);
      const [saleHours, setSaleHours] = useLS("med2_int_saleHours",     6);
      const [admHours,  setAdmHours]  = useLS("med2_int_admHours",      1);
      const [hCost,     setHCost]     = useLS("med2_int_hCost",       650);
      const [goal,      setGoal]      = useLS("med2_int_goal",       5000);
      const [toast,     setToast]     = useState(null);

      const isProv       = model === "provision";
      const adValue      = revenue * runs;
      const incomePerRun = isProv ? revenue * (commPct / 100) : fixedFee;
      const income       = incomePerRun * runs;
      const hours        = saleHours + admHours * runs;
      const cost         = hours * hCost;
      const tb           = income - cost;
      const marginPct    = income > 0 ? (tb / income) * 100 : 0;
      const perHour      = hours > 0 ? income / hours : 0;
      const vsGoal       = goal > 0 ? (perHour / goal) * 100 : 0;

      const score = hours <= 0
        ? { label:"Saknar tid", color:INK2, bg:PAPER, border:HAIR }
        : vsGoal >= 100
        ? { label:"Bra deal",  color:"#3E6B4A", bg:"#EDF2EA", border:"#C3D2BD" }
        : vsGoal >= 60
          ? { label:"Okej deal", color:"#8F7430", bg:"#F6F0DF", border:"#DDCC9E" }
          : { label:"Svag deal", color:"#9C4F44", bg:"#F5E9E5", border:"#DDBBB1" };

      const aTb   = useCountUp(tb);
      const aHour = useCountUp(perHour);

      const handleCopy = () => {
        const rows = [
          client ? ["Annonsör", client] : null,
          seller ? ["Säljare", seller] : null,
          ["Titel", title],
          ["Datum", new Date().toLocaleDateString("sv-SE")],
          null,
          ["Modell", isProv ? "Provision " + commPct + " %" : "Fast arvode"],
          isProv ? ["Annonsvärde", sek(adValue) + " kr"] : ["Arvode per införande", sek(fixedFee) + " kr"],
          ["Antal införanden", runs + " st"],
          ["Timmar", hours + " (sälj " + saleHours + ", hantering " + admHours + " × " + runs + ")"],
          null,
          ["Intäkt till Informa", sek(income) + " kr"],
          ["Kostnad för tiden", sek(cost) + " kr"],
          ["Täckningsbidrag", sek(tb) + " kr"],
          ["Marginal", Math.round(marginPct) + " %"],
          ["Intäkt per timme", sek(perHour) + " kr (mål " + sek(goal) + " kr)"],
          ["Bedömning", score.label],
        ];
        const w = rows.reduce((a, r) => (r ? Math.max(a, r[0].length) : a), 0) + 2;
        const sep = "═".repeat(40);
        const body = rows.map(r => (r === null ? "" : (r[0] + ":").padEnd(w + 1) + r[1])).join("\n");
        const text = [sep, "  INFORMA · Medieförsäljning, intern kalkyl", sep, body, sep].join("\n");
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => setToast("Kopierat till urklipp"), () => setToast("Kunde inte kopiera"));
        } else { setToast("Kunde inte kopiera"); }
      };

      const handleReset = () => {
        setClient(""); setSeller(""); setTitle("Läkartidningen"); setModel("provision");
        setRevenue(38000); setRuns(6); setCommPct(25); setFixedFee(9000);
        setSaleHours(6); setAdmHours(1); setHCost(650); setGoal(5000);
        setToast("Nollställt");
      };

      return (
        <div style={{ maxWidth:1000, margin:"0 auto" }}>
          {toast && <Toast msg={toast} onDone={() => setToast(null)} />}

          <div style={{ textAlign:"center", marginBottom:"2.5rem" }}>
            <h1 style={{ fontFamily:SERIF, fontSize:"clamp(1.6rem,3.5vw,2.4rem)", fontWeight:300,
              color:INK, letterSpacing:"-0.01em", marginBottom:"0.5rem" }}>
              Vad affären ger <em style={{ color:PINK, fontWeight:300 }}>oss</em>
            </h1>
            <p style={{ color:INK2, fontSize:"0.95rem" }}>Internt underlag. Visas aldrig för kund.</p>
          </div>

          <div className="split" style={split}>
            <div style={card}>
              <div style={eyebrow}>Affären</div>
              <TextInput label="Annonsör" value={client} onChange={setClient} placeholder="Företagsnamn" />
              <TextInput label="Säljare" value={seller} onChange={setSeller} placeholder="Namn" />
              <SelectInput label="Titel" value={title} onChange={setTitle} options={TITLES} />

              <div style={{ marginBottom:"1.25rem" }}>
                <div style={{ marginBottom:"0.4rem", fontSize:"0.84rem", fontWeight:500, color:INK2 }}>Ersättningsmodell</div>
                <div style={{ display:"flex", border:`1px solid ${HAIR}`, borderRadius:"2px", padding:"3px", gap:"2px" }}>
                  {[{id:"provision",label:"Provision"},{id:"fast",label:"Fast arvode"}].map(m => (
                    <button key={m.id} type="button" onClick={() => setModel(m.id)}
                      style={{ flex:1, padding:"0.5rem", borderRadius:"2px", border:"none", cursor:"pointer",
                        fontFamily:"inherit", fontSize:"0.85rem", fontWeight:500,
                        background: model === m.id ? NOIR : "transparent",
                        color: model === m.id ? CREAM : INK2, transition:"all 0.2s" }}>
                      {m.label}
                    </button>
                  ))}
                </div>
              </div>

              {isProv ? (
                <React.Fragment>
                  <NumberInput label="Annonsintäkt per införande" value={revenue} onChange={setRevenue} suffix="kr" min={0} step={1000}
                    hint="Det annonsören betalar titeln" />
                  <SliderInput label="Provision till Informa" value={commPct} min={0} max={100} step={1} onChange={setCommPct} suffix="%" />
                </React.Fragment>
              ) : (
                <NumberInput label="Arvode per införande" value={fixedFee} onChange={setFixedFee} suffix="kr" min={0} step={500} />
              )}
              <NumberInput label="Antal införanden" value={runs} onChange={setRuns} suffix="st" min={1} step={1} />

              <div style={sectionHead}>Vår tid</div>
              <NumberInput label="Säljtid för affären" value={saleHours} onChange={setSaleHours} suffix="tim" min={0} step={0.5}
                hint="Research, samtal, offert, förhandling" />
              <NumberInput label="Hantering per införande" value={admHours} onChange={setAdmHours} suffix="tim" min={0} step={0.5}
                hint="Material, bokning, uppföljning" />
              <NumberInput label="Kostnad per timme" value={hCost} onChange={setHCost} suffix="kr" min={0} step={50} />
              <NumberInput label="Vårt mål, intäkt per timme" value={goal} onChange={setGoal} suffix="kr" min={0} step={100}
                hint="Styr bedömningen nedan" />
            </div>

            <div>
              <div style={heroCard}>
                <div style={{ ...eyebrow, color:"rgba(241,236,227,0.62)" }}>Intäkt per nedlagd timme</div>
                <span style={bigNum}>{hours > 0 ? sek(aHour) : "n/a"}</span>
                <div style={{ fontFamily:SERIF, fontStyle:"italic", fontWeight:300,
                  fontSize:"1.35rem", color:"rgba(241,236,227,0.76)", marginTop:"0.6rem" }}>
                  kronor
                </div>
                <BreakEven actual={perHour} breakeven={goal} label="Denna affär" markLabel="Vårt mål" />
                <HeroNote>
                  {hours > 0
                    ? <React.Fragment>Målet är {sek(goal)} kr per timme. Affären ger <Em>{sek(vsGoal)} %</Em> av målet på {dec1(hours)} timmars arbete.</React.Fragment>
                    : <React.Fragment>Fyll i säljtid och hantering så räknar vi intäkt per timme.</React.Fragment>}
                </HeroNote>
              </div>

              <div style={{ background:score.bg, border:`1px solid ${score.border}`, borderRadius:"2px",
                padding:"1rem 1.25rem", marginTop:"1.25rem", display:"flex",
                alignItems:"center", justifyContent:"space-between", gap:"1rem" }}>
                <span style={{ fontSize:"0.8rem", color:score.color, fontWeight:500 }}>
                  Bedömning: minst målet är bra, minst 60 % är okej
                </span>
                <span style={{ fontSize:"1.05rem", color:score.color, fontWeight:600 }}>{score.label}</span>
              </div>

              <div style={{ ...card, marginTop:"1.25rem" }}>
                {isProv && <KeyRow k="Annonsvärde, det annonsören betalar" v={sek(adValue) + " kr"} />}
                <KeyRow k="Intäkt till Informa" v={sek(income) + " kr"} />
                <KeyRow k="Nedlagd tid" v={dec1(hours) + " tim"} />
                <KeyRow k="Kostnad för tiden" v={sek(cost) + " kr"} />
                <KeyRow k="Täckningsbidrag" v={sek(aTb) + " kr"} neg={tb < 0} />
                <KeyRow k="Marginal" v={sek(marginPct) + " %"} neg={marginPct < 0} />
              </div>

              <div className="cta-row no-print" style={{ display:"flex", gap:"0.75rem", marginTop:"1.25rem" }}>
                <button type="button" onClick={handleCopy}
                  style={{ flex:1, padding:"0.85rem 1.5rem", background:NOIR, color:CREAM, border:"none",
                    borderRadius:"2px", fontSize:"0.95rem", fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>
                  Kopiera kalkylen
                </button>
                <button type="button" onClick={handleReset}
                  style={{ padding:"0.85rem 1.5rem", background:"transparent", color:INK, border:`1px solid ${HAIR}`,
                    borderRadius:"2px", fontSize:"0.95rem", fontWeight:600, cursor:"pointer", fontFamily:"inherit" }}>
                  Nollställ
                </button>
              </div>

              <Note>
                Marginalen blir nästan alltid hög i en provisionsaffär, så den säger lite om affären är värd tiden.
                Därför bedöms affären på intäkt per timme mot vårt mål.
              </Note>
            </div>
          </div>
        </div>
      );
    }

    // ────────── App ────────────────────────────────────────────────────────────

      const [tab, setTab] = useState(() => {
        const t = new URLSearchParams(window.location.search).get("tab");
        return ["annons","rekrytering","internal"].includes(t) ? t : "annons";
      });
      const [unlocked, setUnlocked] = useState(false);
      if (!unlocked) return <PinScreen onUnlock={() => setUnlocked(true)} />;

      const TABS = [
        { id:"annons",      label:"För annonsörer" },
        { id:"rekrytering", label:"Rekrytering" },
        { id:"internal",    label:"Säljstöd" },
      ];

      return (
        <div style={{ position:"relative", zIndex:1, minHeight:"100vh" }}>
          <header className="no-print" style={{ position:"sticky", top:0, zIndex:100,
            background:"rgba(241,236,227,0.92)",
            backdropFilter:"blur(20px)", WebkitBackdropFilter:"blur(20px)",
            borderBottom:`1px solid ${HAIR}` }}>
            <div style={{ maxWidth:1140, margin:"0 auto", padding:"0 1.5rem",

              gap:"1rem", flexWrap:"wrap" }}>
              <div style={{ userSelect:"none", lineHeight:0, padding:"0.75rem 0" }}>
                <Wordmark size="1.65rem" />
              </div>
              <nav style={{ display:"flex", border:`1px solid ${HAIR}`, background:PAPER,
                borderRadius:"2px", padding:"3px", gap:"2px", flexWrap:"wrap" }}>
                {TABS.map(item => (
                  <button key={item.id} type="button" onClick={() => setTab(item.id)}
                    style={{ padding:"0.45rem 1.1rem", borderRadius:"2px", border:"none",
                      cursor:"pointer", fontWeight:500, fontSize:"0.875rem", fontFamily:"inherit",
                      background: tab === item.id ? NOIR : "transparent",
                      color: tab === item.id ? CREAM : INK2,
                      transition:"all 0.2s" }}>
                    {item.label}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          <main style={{ maxWidth:1140, margin:"0 auto", padding:"2.75rem 1.5rem 5rem" }}>
            {tab === "annons"      && <div className="tab-in" key="a"><AdvertiserCalc /></div>}
            {tab === "rekrytering" && <div className="tab-in" key="c"><RecruitCalc /></div>}
            {tab === "internal"    && <div className="tab-in" key="d"><InternalCalc /></div>}

            <div className="no-print" style={{ maxWidth:1000, margin:"3.5rem auto 0",
              paddingTop:"1.5rem", borderTop:`1px solid ${HAIR}`, display:"flex",
              justifyContent:"space-between", alignItems:"center", gap:"1rem", flexWrap:"wrap" }}>
              <span style={{ fontFamily:SERIF, fontStyle:"italic", fontWeight:300,
                color:INK2, fontSize:"0.95rem" }}>
                Vi säger som det är <span style={{ color:PINK, fontStyle:"normal" }}>&#10022;</span>
              </span>
              <span style={{ fontSize:"0.8rem", color:INK3 }}>media@informa.se</span>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
